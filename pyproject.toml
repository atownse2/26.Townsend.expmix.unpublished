[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exponential-mixture-model"
version = "0.1.0"
description = "Finite exponential mixture model tools built on ROOT"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["emm", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["cache", "text_round_0", "text_round_1"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["emm", "tools", "tests"]
exclude = ["cache", "text_round_0", "text_round_1"]
reportMissingImports = "none"
